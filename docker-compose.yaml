version: "3.9"

services:
  backend:
    # NOTE: Replace <github-username> with your actual GitHub username or organization name
    image: ghcr.io/<github-username>/esamadhaan-api:latest
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: ${DB_CONNECTION_STRING}
      JwtSettings__SecretKey: ${JWT_SECRET_KEY}
      JwtSettings__Issuer: eSamadhaan
      JwtSettings__Audience: eSamadhaan-Users
      CORS__AllowedOrigins: ${CORS_ALLOWED_ORIGINS:-https://esamadhaan.flushthemoney.com}
    ports:
      - target: 8080
        protocol: http
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s

  frontend:
    image: ghcr.io/<github-username>/esamadhaan-ui:latest
    depends_on:
      - backend
    ports:
      - target: 80
        protocol: http
    healthcheck:
      test:
        ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
