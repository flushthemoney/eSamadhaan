services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: esamadhaan-api
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=${DB_CONNECTION_STRING}
      - JwtSettings__SecretKey=${JWT_SECRET_KEY}
      - JwtSettings__Issuer=${JWT_ISSUER:-eSamadhaan}
      - JwtSettings__Audience=${JWT_AUDIENCE:-eSamadhaan-Users}
      - CORS__AllowedOrigins=${CORS_ALLOWED_ORIGINS:-http://localhost:4200,https://localhost:4200}
    networks:
      - esamadhaan-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend/esamadhaan-ui
      dockerfile: Dockerfile
      args:
        - API_URL=${API_URL:-http://localhost:8080/api}
    container_name: esamadhaan-ui
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - esamadhaan-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost/health",
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  esamadhaan-network:
    driver: bridge
