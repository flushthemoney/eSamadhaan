name: Build and Push Docker Images

on:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/esamadhaan-api:latest \
            ./backend

          docker push ghcr.io/${{ github.repository_owner }}/esamadhaan-api:latest

      - name: Build & push frontend image
        run: |
          docker build \
            --build-arg API_URL=https://api/esamadhaan.flushthemoney.com/api \
            -t ghcr.io/${{ github.repository_owner }}/esamadhaan-ui:latest \
            ./frontend/esamadhaan-ui

          docker push ghcr.io/${{ github.repository_owner }}/esamadhaan-ui:latest
