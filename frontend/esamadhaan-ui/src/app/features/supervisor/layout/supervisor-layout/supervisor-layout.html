<div class="supervisor-layout">
  <mat-sidenav-container class="sidenav-container">
    <mat-sidenav #sidenav mode="side" [opened]="sidenavOpened" class="sidenav">
      <div class="sidenav-header">
        <h2>eSamadhaan</h2>
        <p>Supervisor Portal</p>
      </div>
      <app-navigation-menu
        [menuItems]="menuItems"
        (menuAction)="handleMenuAction($event)"
      ></app-navigation-menu>
    </mat-sidenav>

    <mat-sidenav-content class="content">
      <mat-toolbar color="primary" class="toolbar">
        <button mat-icon-button (click)="toggleSidenav()" aria-label="Toggle menu">
          <mat-icon>menu</mat-icon>
        </button>
        <span class="spacer"></span>
        <img src="assets/state.png" alt="eSamadhaan" class="portal-logo" />
      </mat-toolbar>

      <main class="main-content">
        <router-outlet></router-outlet>
      </main>
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
