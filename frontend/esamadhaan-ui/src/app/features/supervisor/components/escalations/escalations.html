<app-page-header title="Escalated Grievances" subtitle="Grievances that require attention">
</app-page-header>

@if (isLoading) {
  <app-loading-spinner [isLoading]="isLoading"></app-loading-spinner>
} @else if (escalations.length === 0) {
  <app-empty-state
    icon="priority_high"
    message="No escalated grievances at this time"
    subMessage="All grievances are being handled normally."
  ></app-empty-state>
} @else {
  <mat-card>
    <mat-card-content>
      <table mat-table [dataSource]="dataSource" class="escalation-table">
        <ng-container matColumnDef="grievanceNumber">
          <th mat-header-cell *matHeaderCellDef>Grievance Number</th>
          <td mat-cell *matCellDef="let escalation">
            {{ escalation.grievanceNumber }}
            <mat-chip color="warn" style="margin-left: 8px;">Escalated</mat-chip>
          </td>
        </ng-container>

        <ng-container matColumnDef="departmentName">
          <th mat-header-cell *matHeaderCellDef>Department</th>
          <td mat-cell *matCellDef="let escalation">{{ escalation.departmentName }}</td>
        </ng-container>

        <ng-container matColumnDef="categoryName">
          <th mat-header-cell *matHeaderCellDef>Category</th>
          <td mat-cell *matCellDef="let escalation">{{ escalation.categoryName }}</td>
        </ng-container>

        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef>Status</th>
          <td mat-cell *matCellDef="let escalation">
            <app-grievance-status-badge [status]="escalation.currentStatus"></app-grievance-status-badge>
          </td>
        </ng-container>

        <ng-container matColumnDef="daysSinceSubmission">
          <th mat-header-cell *matHeaderCellDef>Days Since Submission</th>
          <td mat-cell *matCellDef="let escalation">{{ escalation.daysSinceSubmission }}</td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Actions</th>
          <td mat-cell *matCellDef="let escalation">
            <button mat-icon-button [routerLink]="['/supervisor/grievances']" [queryParams]="{id: escalation.id}" aria-label="View escalation details">
              <mat-icon>visibility</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>

      <mat-paginator
        [pageSizeOptions]="[10, 25, 50]"
        showFirstLastButtons
      ></mat-paginator>
    </mat-card-content>
  </mat-card>
}
