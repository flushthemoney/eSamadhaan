<app-page-header title="Status Overview Report" subtitle="Distribution of grievances by status">
</app-page-header>

@if (isLoading) {
  <app-loading-spinner [isLoading]="isLoading"></app-loading-spinner>
} @else {
  <mat-card>
    <mat-card-content>
      <table mat-table [dataSource]="statusReport" class="report-table">
        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef>Status</th>
          <td mat-cell *matCellDef="let item">
            <app-grievance-status-badge [status]="item.status"></app-grievance-status-badge>
          </td>
        </ng-container>

        <ng-container matColumnDef="count">
          <th mat-header-cell *matHeaderCellDef>Count</th>
          <td mat-cell *matCellDef="let item">{{ item.count }}</td>
        </ng-container>

        <ng-container matColumnDef="percentage">
          <th mat-header-cell *matHeaderCellDef>Percentage</th>
          <td mat-cell *matCellDef="let item">{{ item.percentage.toFixed(1) }}%</td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </mat-card-content>
  </mat-card>
}
