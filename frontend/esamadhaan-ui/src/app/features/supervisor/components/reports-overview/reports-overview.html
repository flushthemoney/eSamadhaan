<app-page-header title="Status Overview Report" subtitle="Distribution of grievances by status">
</app-page-header>

@if (isLoading) {
  <app-loading-spinner [isLoading]="isLoading"></app-loading-spinner>
} @else {
  <div class="overview-container">
    <mat-card class="chart-card">
      <mat-card-header>
        <mat-card-title>Status Distribution</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <div class="pie-chart-container">
          <svg viewBox="0 0 200 200" class="pie-chart">
            @for (segment of getPieChartSegments(); track segment.status) {
              <path
                [attr.d]="segment.path"
                [attr.fill]="segment.color"
                [attr.stroke]="'white'"
                [attr.stroke-width]="2"
                class="pie-segment">
                <title>{{ segment.label }}: {{ segment.count }} ({{ segment.percentage.toFixed(1) }}%)</title>
              </path>
            }
            <circle cx="100" cy="100" r="60" fill="white"></circle>
            <text x="100" y="88" text-anchor="middle" class="pie-center-text">Total</text>
            <text x="100" y="115" text-anchor="middle" class="pie-center-value">{{ getTotalCount() }}</text>
          </svg>
          <div class="pie-legend">
            @for (item of getPieChartData(); track item.status) {
              <div class="legend-item">
                <span class="legend-color" [style.background-color]="getStatusColor(item.status)"></span>
                <span class="legend-label">{{ item.label }}</span>
                <span class="legend-value">{{ item.count }} ({{ item.percentage.toFixed(1) }}%)</span>
              </div>
            }
          </div>
        </div>
      </mat-card-content>
    </mat-card>
  </div>
}
